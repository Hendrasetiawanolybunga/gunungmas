{% extends 'core/base_dashboard.html' %}

{% block title %}Scanner Tiket - PO Gunung Mas{% endblock %}

{% block header_title %}Scanner Tiket Web{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-4 text-center">
                <h5 class="fw-bold mb-3"><i class="fa-solid fa-qrcode text-primary"></i> Pindai QR Code Tiket</h5>
                <p class="text-muted small mb-4">Arahkan kamera ke QR Code tiket penumpang untuk verifikasi.</p>
                
                <div id="reader" style="width: 100%; max-width: 500px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: 2px solid #e2e8f0;"></div>
                
                <div id="result-container" class="mt-4 text-start d-none">
                    <div class="alert alert-info rounded-3" id="result-message"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
        
        let isScanning = false;
        
        function onScanSuccess(decodedText, decodedResult) {
            if (isScanning) return; // Prevent multiple scans at once
            isScanning = true;
            
            // Hentikan scanner sementara
            html5QrCode.pause();
            
            Swal.fire({
                title: 'Memverifikasi...',
                text: 'Sedang mengecek data tiket ke server',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });
            
            fetch("{% url 'api_verify_qr' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ qr_text: decodedText })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    Swal.fire({
                        icon: 'success',
                        title: 'Tiket Valid!',
                        html: `
                            <b>ID Pemesanan:</b> GM-${data.id_pemesanan}<br>
                            <b>Nama:</b> ${data.nama_pelanggan}<br>
                            <b>No. Kursi:</b> ${data.nomor_kursi}
                        `,
                        confirmButtonText: 'Scan Lagi'
                    }).then(() => {
                        isScanning = false;
                        html5QrCode.resume();
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Tiket Ditolak!',
                        text: data.message,
                        confirmButtonText: 'Tutup'
                    }).then(() => {
                        isScanning = false;
                        html5QrCode.resume();
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Kesalahan Sistem',
                    text: 'Gagal terhubung ke server verifikasi.',
                    confirmButtonText: 'Tutup'
                }).then(() => {
                    isScanning = false;
                    html5QrCode.resume();
                });
            });
        }

        function onScanFailure(error) {
            // handle scan failure, usually better to ignore and keep scanning
        }

        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
        .catch(err => {
            console.error("Gagal memulai scanner:", err);
            document.getElementById('reader').innerHTML = `
                <div class="alert alert-danger m-3">
                    <i class="fa-solid fa-camera-slash mb-2 fs-3"></i><br>
                    Gagal mengakses kamera. Pastikan Anda memberikan izin akses kamera pada browser.
                </div>
            `;
        });
    });
</script>
{% endblock %}
