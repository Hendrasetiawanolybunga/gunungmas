{% extends 'core/base_dashboard.html' %}
{% block title %}Scan Tiket Penumpang{% endblock %}
{% block content %}
<div class="mb-4">
    <h4 class="fw-bold text-dark mb-1">Scan Tiket Keberangkatan</h4>
    <p class="text-secondary small mb-0">Arahkan kamera ke QR Code E-Tiket penumpang untuk memvalidasi manifest.</p>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4 p-4 text-center">
            <div id="reader" style="width: 100%; border-radius: 12px; overflow: hidden; background: #fafafa;"></div>
            <div id="result" class="mt-3 fw-bold"></div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    function onScanSuccess(decodedText, decodedResult) {
        html5QrcodeScanner.clear();
        document.getElementById('result').innerHTML = '<span class="text-primary">Memverifikasi kode tiket...</span>';
        
        fetch("{% url 'api_verify_qr' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({ qr_text: decodedText })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                Swal.fire({
                    icon: 'success',
                    title: 'Tiket Valid!',
                    html: `<strong>Penumpang:</strong> ${data.nama_pelanggan}<br><strong>Kursi:</strong> ${data.nomor_kursi}<br><strong>Status:</strong> Sudah di Bus`,
                    confirmButtonColor: '#4f46e5'
                }).then(() => { location.reload(); });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Gagal',
                    text: data.message,
                    confirmButtonColor: '#ef4444'
                }).then(() => { location.reload(); });
            }
        })
        .catch(err => {
            Swal.fire({ icon: 'error', title: 'Error', text: 'Terjadi kesalahan sistem.' });
        });
    }

    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
</script>
{% endblock %}
