<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Profil Sopir - PO Gunung Mas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .header { background: linear-gradient(135deg, #4f46e5, #3b82f6); color: white; padding: 20px; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }
        .card-custom { border: none; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="header d-flex justify-content-between align-items-center mb-4">
        <div>
            <h5 class="fw-bold mb-0">Kelola Akun</h5>
            <small class="opacity-75">Perbarui informasi profil dan kata sandi Anda</small>
        </div>
        <a href="{% url 'sopir_dashboard' %}" class="btn btn-sm btn-outline-light rounded-pill px-3"><i class="fa-solid fa-arrow-left me-1"></i> Kembali</a>
    </div>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card card-custom">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <div class="bg-light text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px; font-size: 32px;">
                                <i class="fa-solid fa-user-tie"></i>
                            </div>
                            <h5 class="fw-bold text-dark">{{ sopir.nama_sopir }}</h5>
                            <p class="text-secondary small mb-0">Lisensi: {{ sopir.nomor_lisensi }}</p>
                        </div>
                        
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Nama Lengkap</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" name="nama_sopir" class="form-control border-start-0 ps-1" value="{{ sopir.nama_sopir }}" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Nomor Telepon</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-phone"></i></span>
                                    <input type="text" name="nomor_telepon" class="form-control border-start-0 ps-1" value="{{ sopir.nomor_telepon }}" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold small text-secondary">Password (Opsional)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" name="password" class="form-control border-start-0 ps-1" placeholder="Isi untuk mengganti password baru">
                                </div>
                                <div class="form-text small text-muted">Kosongkan jika tidak ingin mengubah password saat ini.</div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-bold"><i class="fa-solid fa-floppy-disk me-1"></i> Simpan Perubahan</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
