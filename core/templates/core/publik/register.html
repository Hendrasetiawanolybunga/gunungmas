<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Penumpang - PO Gunung Mas Online</title>
    <!-- Google Fonts Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgb(15, 23, 42) 0%, rgb(30, 27, 75) 100.2%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .register-card {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .register-title {
            font-weight: 700;
            font-size: 26px;
            background: linear-gradient(135deg, #6366f1, #d946ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 8px;
        }

        .register-subtitle {
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-label-custom {
            font-weight: 600;
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .input-group-custom {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .input-group-custom:focus-within {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .input-group-text-custom {
            background-color: transparent;
            border: none;
            color: #64748b;
            padding-left: 16px;
            padding-right: 8px;
        }

        .input-custom, .select-custom, .textarea-custom {
            background-color: transparent;
            border: none;
            color: #ffffff;
            padding: 12px 16px 12px 4px;
            font-size: 14px;
            outline: none !important;
            box-shadow: none !important;
        }

        .select-custom option {
            background-color: #0f172a;
            color: #ffffff;
        }

        .input-custom::placeholder, .textarea-custom::placeholder {
            color: #475569;
        }

        .password-toggle {
            background-color: transparent;
            border: none;
            color: #64748b;
            padding-right: 16px;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: #ffffff;
        }

        .btn-submit {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            color: white;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #94a3b8;
        }

        .login-link a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .login-link a:hover {
            color: #a5b4fc;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Back to home -->
    <a href="{% url 'public_home' %}" class="back-link">
        <i class="fa-solid fa-arrow-left me-1"></i> Kembali ke Beranda
    </a>

    <div class="register-card">
        <h3 class="register-title">Daftar Penumpang</h3>
        <p class="register-subtitle">Buat akun untuk mulai memesan tiket bus Gunung Mas</p>
        
        <form action="{% url 'pelanggan_register' %}" method="POST" autocomplete="off">
            {% csrf_token %}
            
            <div class="row">
                <!-- Nama Lengkap -->
                <div class="col-md-6 mb-3">
                    <label for="nama_pelanggan" class="form-label form-label-custom">Nama Lengkap</label>
                    <div class="input-group input-group-custom">
                        <span class="input-group-text input-group-text-custom"><i class="fa-solid fa-user"></i></span>
                        <input type="text" name="nama_pelanggan" id="nama_pelanggan" class="form-control input-custom" placeholder="Mario Nagung" required>
                    </div>
                </div>
                
                <!-- Jenis Kelamin -->
                <div class="col-md-6 mb-3">
                    <label for="jenis_kelamin" class="form-label form-label-custom">Jenis Kelamin</label>
                    <div class="input-group input-group-custom">
                        <span class="input-group-text input-group-text-custom"><i class="fa-solid fa-venus-mars"></i></span>
                        <select name="jenis_kelamin" id="jenis_kelamin" class="form-select select-custom" required>
                            <option value="" disabled selected>Pilih...</option>
                            <option value="Laki-laki">Laki-laki</option>
                            <option value="Perempuan">Perempuan</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row">
                <!-- No Telepon -->
                <div class="col-md-6 mb-3">
                    <label for="nomor_telpon" class="form-label form-label-custom">Nomor Telepon / WA</label>
                    <div class="input-group input-group-custom">
                        <span class="input-group-text input-group-text-custom"><i class="fa-solid fa-phone"></i></span>
                        <input type="text" name="nomor_telpon" id="nomor_telpon" class="form-control input-custom font-monospace" placeholder="0812xxxxxxxx" required>
                    </div>
                </div>
                
                <!-- Email -->
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label form-label-custom">Email</label>
                    <div class="input-group input-group-custom">
                        <span class="input-group-text input-group-text-custom"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" name="email" id="email" class="form-control input-custom" placeholder="nama@email.com" required>
                    </div>
                </div>
            </div>

            <!-- Alamat -->
            <div class="mb-3">
                <label for="alamat" class="form-label form-label-custom">Alamat Rumah</label>
                <div class="input-group input-group-custom">
                    <span class="input-group-text input-group-text-custom" style="align-self: flex-start; margin-top: 12px;"><i class="fa-solid fa-map-location-dot"></i></span>
                    <textarea name="alamat" id="alamat" class="form-control textarea-custom" rows="2" placeholder="Masukkan alamat lengkap..." style="resize: none;" required></textarea>
                </div>
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label for="password" class="form-label form-label-custom">Kata Sandi</label>
                <div class="input-group input-group-custom">
                    <span class="input-group-text input-group-text-custom"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" id="password" class="form-control input-custom" placeholder="Minimal 6 karakter" required>
                    <button type="button" class="password-toggle" id="togglePassword">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="btn-submit">
                Daftar Sekarang <i class="fa-solid fa-user-plus ms-1"></i>
            </button>
        </form>
        
        <div class="login-link">
            Sudah punya akun? <a href="{% url 'pelanggan_login' %}">Masuk di sini</a>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Script Eye Show/Hide Password & SweetAlert2 Django Message handler -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                if (type === 'password') {
                    eyeIcon.classList.remove('fa-eye-slash');
                    eyeIcon.classList.add('fa-eye');
                } else {
                    eyeIcon.classList.remove('fa-eye');
                    eyeIcon.classList.add('fa-eye-slash');
                }
            });

            // SweetAlert2 notification handler
            {% if messages %}
                {% for message in messages %}
                    let iconType = 'info';
                    {% if message.tags == 'error' %}
                        iconType = 'error';
                    {% elif message.tags == 'success' %}
                        iconType = 'success';
                    {% elif message.tags == 'warning' %}
                        iconType = 'warning';
                    {% endif %}
                    
                    Swal.fire({
                        icon: iconType,
                        title: iconType.charAt(0).toUpperCase() + iconType.slice(1),
                        text: "{{ message|escapejs }}",
                        background: '#1e1b4b',
                        color: '#ffffff',
                        confirmButtonColor: '#6366f1',
                    });
                {% endfor %}
            {% endif %}
        });
    </script>
</body>
</html>
