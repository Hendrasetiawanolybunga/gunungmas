{% extends 'core/publik/base_public.html' %}

{% block title %}Profil Saya - PO Gunung Mas{% endblock %}

{% block content %}
<style>
    .profil-header {
        background-color: #0f172a;
        color: #ffffff;
        padding: 40px 0;
        border-bottom: 1px solid #1e293b;
    }

    .profil-card {
        background: #ffffff;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        padding: 30px;
    }

    .profil-input-icon {
        background-color: #f8fafc;
        border-right: 0;
    }

    .profil-control {
        border-left: 0;
    }

    .profil-control:focus {
        border-color: #e2e8f0;
        box-shadow: none;
    }
</style>

<!-- Header -->
<header class="profil-header mb-5">
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-1">
                <li class="breadcrumb-item"><a href="{% url 'public_home' %}" class="text-secondary text-decoration-none">Home</a></li>
                <li class="breadcrumb-item active text-white" aria-current="page">Kelola Akun</li>
            </ol>
        </nav>
        <h3 class="fw-bold mb-0"><i class="fa-solid fa-user-gear text-primary me-2"></i> Pengaturan Akun Profil Anda</h3>
    </div>
</header>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            
            <div class="profil-card">
                <h5 class="fw-bold text-dark mb-4"><i class="fa-solid fa-id-card text-primary me-2"></i> Data Diri Penumpang</h5>
                
                <form action="{% url 'pelanggan_profil' %}" method="POST" autocomplete="off">
                    {% csrf_token %}
                    
                    <!-- Nama Lengkap -->
                    <div class="mb-4">
                        <label for="nama_pelanggan" class="form-label fw-semibold text-secondary" style="font-size: 13px;">Nama Lengkap</label>
                        <div class="input-group">
                            <span class="input-group-text profil-input-icon text-secondary"><i class="fa-solid fa-user"></i></span>
                            <input type="text" name="nama_pelanggan" id="nama_pelanggan" class="form-control profil-control" value="{{ pelanggan.nama_pelanggan }}" required>
                        </div>
                    </div>
                    
                    <!-- Jenis Kelamin -->
                    <div class="mb-4">
                        <label for="jenis_kelamin" class="form-label fw-semibold text-secondary" style="font-size: 13px;">Jenis Kelamin</label>
                        <div class="input-group">
                            <span class="input-group-text profil-input-icon text-secondary"><i class="fa-solid fa-venus-mars"></i></span>
                            <select name="jenis_kelamin" id="jenis_kelamin" class="form-select profil-control" required>
                                <option value="Laki-laki" {% if pelanggan.jenis_kelamin == 'Laki-laki' %}selected{% endif %}>Laki-laki</option>
                                <option value="Perempuan" {% if pelanggan.jenis_kelamin == 'Perempuan' %}selected{% endif %}>Perempuan</option>
                            </select>
                        </div>
                    </div>

                    <!-- Nomor Telepon -->
                    <div class="mb-4">
                        <label for="nomor_telpon" class="form-label fw-semibold text-secondary" style="font-size: 13px;">Nomor Telepon / WhatsApp</label>
                        <div class="input-group">
                            <span class="input-group-text profil-input-icon text-secondary"><i class="fa-solid fa-phone"></i></span>
                            <input type="text" name="nomor_telpon" id="nomor_telpon" class="form-control profil-control" value="{{ pelanggan.nomor_telpon }}" required>
                        </div>
                    </div>

                    <!-- Alamat -->
                    <div class="mb-4">
                        <label for="alamat" class="form-label fw-semibold text-secondary" style="font-size: 13px;">Alamat Domisili</label>
                        <div class="input-group">
                            <span class="input-group-text profil-input-icon text-secondary"><i class="fa-solid fa-map-location-dot"></i></span>
                            <input type="text" name="alamat" id="alamat" class="form-control profil-control" value="{{ pelanggan.alamat }}" required>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold text-secondary" style="font-size: 13px;">Alamat Email</label>
                        <div class="input-group">
                            <span class="input-group-text profil-input-icon text-secondary"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" name="email" id="email" class="form-control profil-control" value="{{ pelanggan.email }}" required>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-secondary" style="font-size: 13px;">Kata Sandi (Password)</label>
                        <div class="input-group">
                            <span class="input-group-text profil-input-icon text-secondary"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password" id="password" class="form-control" style="border-left: 0; border-right: 0;" value="{{ pelanggan.password }}" required>
                            <button type="button" class="btn btn-light border" id="togglePasswordBtn" style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                                <i class="fa-solid fa-eye text-secondary" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex justify-content-end gap-2 pt-3 border-top mt-4">
                        <a href="{% url 'public_home' %}" class="btn btn-outline-secondary px-4 rounded-3">Batal</a>
                        <button type="submit" class="btn btn-primary px-4 rounded-3">
                            <i class="fa-solid fa-circle-check me-1"></i> Simpan Perubahan
                        </button>
                    </div>
                </form>
            </div>
            
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        
        toggleBtn.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        });
    });
</script>
{% endblock %}
